name: Release

# A tag vX.Y.Z builds the Docker image for amd64 and arm64, pushes it to the GitHub container
# registry (ghcr.io/<owner>/screenmates:X.Y.Z, X.Y and latest) and creates the GitHub release
# with that version's section of CHANGELOG.md. Pull requests that touch the build only build.

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - backend/requirements.txt
      - frontend/package-lock.json

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/version.py)
          if [ "v$code" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but backend/app/version.py says $code"
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from the changelog
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## " v " ") == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No section for $v in CHANGELOG.md"
            exit 1
          fi
          {
            echo
            echo "Docker image: \`ghcr.io/$GITHUB_REPOSITORY:$v\`"
          } >> notes.md

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "screenmates ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
