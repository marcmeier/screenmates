name: Feature request
description: Suggest an idea for screenmates
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation on your movie nights – what's missing or cumbersome today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: Your idea for a solution. Mockups or examples from other apps are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
