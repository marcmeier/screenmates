[project]
name = "screenmates-backend"
version = "0.4.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Depends() in defaults is the idiom
  "RUF001",  # German typographic quotes in user-facing strings are intended
]

[tool.ruff.lint.per-file-ignores]
# Generated migrations import sqlmodel for AutoString; not every revision uses it.
"migrations/versions/*" = ["RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = [
  # Starlette's TestClient warns about its own httpx dependency; not actionable here.
  "ignore:Using `httpx` with `starlette.testclient`",
]
