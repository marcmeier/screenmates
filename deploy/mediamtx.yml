# MediaMTX for the screenmates "Kino": one WebRTC path, fanned out to all viewers.
#
# Browsers and OBS never talk to MediaMTX's HTTP port directly – screenmates
# proxies WHIP/WHEP signalling and asks MediaMTX to check every publish/read
# against its own auth endpoint. Only the media port (8189) must be public.

logLevel: info

# Every action is checked by screenmates. The API stays on localhost and is
# excluded so the backend can read the stream status.
authMethod: http
authHTTPAddress: http://127.0.0.1:8000/api/kino/mtx-auth
authHTTPExclude:
  - action: api

api: true
apiAddress: 127.0.0.1:9997

# Only WebRTC: WHIP in (browser or OBS ≥ 30), WHEP out.
rtsp: false
rtmp: false
hls: false
srt: false
moq: false

# UDP receive buffer per socket. The Linux default (208 KB) overflows when a 1080p
# keyframe arrives as one burst while MediaMTX is busy for a moment: the kernel drops
# packets (RcvbufErrors) and viewers see the picture break up and hear gaps.
# Bigger values only take effect up to the host's net.core.rmem_max – see README "Kino".
udpReadBufferSize: 0

webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
# Public hostname/IP of the server, so viewers outside your LAN get a reachable
# ICE candidate. Override with MTX_WEBRTCADDITIONALHOSTS=kino.example.com
webrtcAdditionalHosts: []
# STUN lets MediaMTX find its public address. With webrtcAdditionalHosts set it isn't needed;
# remove it (or use your own server) if MediaMTX shouldn't talk to Google - see docs/PRIVACY.md.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# One path per group: kino-<group id> (see backend/app/routers/kino.py).
paths:
  "~^kino-[0-9]+$": {}
