services:
  screenmates:
    # The released image; `docker compose up --build` builds this checkout instead
    # (and so does `up` when the image can't be pulled). SCREENMATES_VERSION pins a release.
    image: ghcr.io/marcmeier/screenmates:${SCREENMATES_VERSION:-latest}
    build: .
    ports: ["8000:8000"]
    env_file:
      - path: backend/.env
        required: false
    environment:
      # Kino: talk to MediaMTX over the internal network.
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_API_URL: http://mediamtx:9997
    volumes:
      - screenmates-data:/data
    restart: unless-stopped

  # Media server for the Kino. Its HTTP ports stay inside this network; only the
  # WebRTC media port must be reachable from the internet (UDP, TCP as fallback).
  mediamtx:
    image: bluenviron/mediamtx:1.21.1
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_AUTHHTTPADDRESS: http://screenmates:8000/api/kino/mtx-auth
      MTX_APIADDRESS: :9997
      MTX_WEBRTCADDRESS: :8889
      # Public hostname or IP of this server, so viewers outside your network can connect
      # (KINO_PUBLIC_HOST is the old name):
      MTX_WEBRTCADDITIONALHOSTS: ${CINEMA_PUBLIC_HOST:-${KINO_PUBLIC_HOST:-}}
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
    restart: unless-stopped

volumes:
  screenmates-data:
